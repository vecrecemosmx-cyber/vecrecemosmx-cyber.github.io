<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Real con Google</title>
    <!-- Enlace correcto a tu hoja de estilos unificada -->
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <!-- PANTALLA 1: INICIO DE SESIÓN -->
    <div id="login-screen" class="card">
        <h1>Bienvenido</h1>
        <p>Inicia sesión para acceder al contenido exclusivo.</p>
        
        <div id="buttonDiv" class="google-btn-container">
            <span style="color: #888; font-size: 13px;">Iniciando servicio de Google...</span>
        </div>
    </div>

    <script>
        function iniciarBotonGoogle() {
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                document.getElementById("buttonDiv").innerHTML = "";

                google.accounts.id.initialize({
                    client_id: "://googleusercontent.com",
                    callback: handleCredentialResponse,
                    context: "signin",
                    ux_mode: "popup",
                    auto_select: false
                });

                google.accounts.id.renderButton(
                    document.getElementById("buttonDiv"),
                    { 
                        type: "standard",
                        theme: "outline", 
                        size: "large", 
                        text: "signin_with", 
                        shape: "pill",
                        logo_alignment: "left"
                    }
                );
            } else {
                document.getElementById("buttonDiv").innerHTML = 
                `<p style='color:#dc3545; font-size:12px; font-weight:600;'>
                    Error: Ejecuta este archivo mediante un servidor local (http://localhost).
                 </p>`;
            }
        }

        window.onload = function() {
            setTimeout(iniciarBotonGoogle, 600);
        };

        function parseJwt(token) {
            try {
                var base64Url = token.split('.');
                var base64 = base64Url[1].replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) { base64 += '='; }
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (err) {
                console.error("Fallo interno al descifrar el token JWT:", err);
                throw err;
            }
        }

        function handleCredentialResponse(response) {
            try {
                const responsePayload = parseJwt(response.credential);
                const archivoParaCargar = "plataforma.html";

                fetch(archivoParaCargar)
                    .then(res => {
                        if (!res.ok) throw new Error("No se pudo cargar el archivo " + archivoParaCargar);
                        return res.text();
                    })
                    .then(htmlDeLaPlataforma => {
                        // 1. Cambiamos la clase del body para activar los estilos de la plataforma
                        document.body.innerHTML = "";
                        document.body.className = "plataforma-body";

                        // 2. Inyectamos la barra de bienvenida con los datos reales de Google
                        const barraUsuario = `
                            <div style="display:flex; align-items:center; justify-content:space-between; background:#f8f9fa; padding:10px 20px; border-bottom:1px solid #e9ecef; font-family:'Segoe UI',sans-serif; width:100%;">
                                <div style="display:flex; align-items:center; gap:12px;">
                                    <img src="${responsePayload.picture}" alt="Avatar" style="width:40px; height:40px; border-radius:50%; border:2px solid #764ba2;">
                                    <div style="text-align:left;">
                                        <div style="font-size:14px; font-weight:bold; color:#333;">${responsePayload.name}</div>
                                        <div style="font-size:12px; color:#666;">${responsePayload.email}</div>
                                    </div>
                                </div>
                                <button onclick="logout();" style="background:#dc3545; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600;">Cerrar Sesión</button>
                            </div>
                        `;

                        // 3. Colocamos la barra seguida del HTML dinámico
                        document.body.innerHTML = barraUsuario + htmlDeLaPlataforma;

                        // 4. Inyectamos el script modular
                        const scriptOriginal = document.createElement("script");
                        scriptOriginal.type = "module";
                        scriptOriginal.src = "script.js";
                        document.body.appendChild(scriptOriginal);
                    })
                    .catch(err => {
                        console.error("Error al jalar el archivo externo:", err);
                        document.body.innerHTML = `<p style="color:red; text-align:center; padding:20px;">Error al cargar la plataforma.</p>`;
                    });

            } catch (error) {
                console.error("Error en autenticación:", error);
                alert("Ocurrió un problema leyendo tu cuenta de Google.");
            }
        }

        function logout() {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.disableAutoSelect();
            }
            window.location.reload();
        }
    </script>
</body>
</html>
